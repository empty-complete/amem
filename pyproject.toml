[project]
name = "amemo"
dynamic = ["version"]                # amemo.__version__; tools/release.py сверяет его с amemo-web и меткой релиза
description = "Verifiable shared memory for AI agents and people: atoms with checked source quotes, revisions and review on PostgreSQL + pgvector"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = []                   # текст лицензии с именем автора в пакет не кладём: он в LICENSE.txt репозитория
authors = [{name = "empty-complete"}]
requires-python = ">=3.11"
keywords = ["agent-memory", "claude-memory", "knowledge-base", "mcp-server", "pgvector", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pymupdf>=1.24",
  "rapidfuzz>=3.0",
  "pydantic>=2.13,<3",
  "pyyaml>=6",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.5.1,<1",
  "rfc8785==0.1.4",
  "ucumvert==0.3.2",
  "pint>=0.25,<0.26",
  "openpyxl>=3.1",
  "packaging>=23",
  # служба HTTP (подпроект 4): синхронные обработчики в пуле потоков, соединения из пула psycopg
  "starlette>=1.10,<2",
  "anyio>=4.1",                     # to_thread.run_sync(abandon_on_cancel=…): фоновые шаги обновления
  "uvicorn>=0.30",
  "psycopg-pool>=3.2,<4",
  "python-multipart>=0.0.20",
  # MCP (подпроект 4b): /mcp службы (Streamable HTTP) и amemo mcp (stdio) — официальный SDK. Только 2.3.x:
  # amemo/service/mcp.py опирается на приватный MCPServer._tool_manager и на session_manager, который создаёт
  # streamable_http_app(), — в следующей минорной версии они могут поменяться без объявления
  "mcp>=2.3,<2.4",
  "mcp-types>=2.3,<2.4",             # mcp_types импортируется напрямую; mcp 2.3 сам требует ту же версию
]

[project.urls]
Homepage = "https://github.com/empty-complete/amemo"
Source = "https://github.com/empty-complete/amemo"
Issues = "https://github.com/empty-complete/amemo/issues"

[project.scripts]
amemo = "amemo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "linkml==1.12.1", "linkml-runtime==1.12.1", "jsonschema>=4.20", "ocfl-py==2.1.0",
       "httpx2>=2.0",                    # клиент starlette.testclient
       "openapi-spec-validator>=0.8.4"]  # тест: контракт HTTP v1 — верный OpenAPI 3.1 (его ставит и linkml)
embed = ["fastembed>=0.9.1,<0.10"]
web = ["amemo-web==0.1.0a3"]      # статика веб-UI, web/python; служба отдаёт по /ui. Версия — та же, что у amemo

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77"]        # license как выражение SPDX и license-files (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "amemo.__version__"}

[tool.setuptools.packages.find]
include = ["amemo*"]

[tool.setuptools.package-data]
amemo = ["schema/*.yaml", "schema/*.json", "sql/*.sql", "packs/core/pack.yaml", "packs/core/vocab/*.yaml", "packs/core/templates/*.yaml",
        "service/*.yaml", "packs/core/skills/*/SKILL.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["amemo/model_v1.py"]   # генерируется tools/gen_schema.py

[tool.ruff.lint]
# F — pyflakes (неиспользуемое, неопределённое), E9 — синтаксис. Следующие ступени — docs/superpowers/specs/2026-11-09-amemo-hardening-design.md
select = ["F", "E9"]
