id: amem
name: amem_v1
title: amem — схема атома v1
description: >-
  Единственное описание схемы базы знаний. Из него генерируются amem/model_v1.py (Pydantic)
  и amem/schema/amem_v1.schema.json (JSON Schema): python tools/gen_schema.py.
  Коды полей, видов и связей — латиницей и неизменны; подписи — в аннотациях label_ru / label_en.
version: 1.0.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  amem: amem/
default_prefix: amem
default_range: string
imports:
  - linkml:types

# Ссылки между записями — строки с приставкой типа: atm:, ent:, obj:.
# После приставки — UUIDv7 или читаемый key; @имя — запись из той же пачки (только во входных данных).
# Шаблоны (pattern) заданы у полей, а не у типов: gen-pydantic проверяет только шаблоны полей.

enums:
  Status:
    description: Статус атома, сущности или понятия словаря.
    permissible_values:
      draft:
        annotations:
          label_ru: не проверен
          label_en: draft
          definition_ru: Прошёл уровни проверки 1–4 без замечаний, ждёт смысловой проверки.
      needs_review:
        annotations:
          label_ru: на проверке
          label_en: needs review
          definition_ru: Есть предупреждение или высокий риск — ждёт человека.
      auto_verified:
        annotations:
          label_ru: автопроверка
          label_en: auto-verified
          definition_ru: Все пять уровней проверки пройдены, риск низкий.
      verified:
        annotations:
          label_ru: проверено человеком
          label_en: verified
          definition_ru: Человек подтвердил по источнику.
      rejected:
        annotations:
          label_ru: отклонён
          label_en: rejected
          definition_ru: Человек отклонил.
      deprecated:
        annotations:
          label_ru: выведен из оборота
          label_en: deprecated
          definition_ru: Больше не используется; хранится для истории.
      superseded:
        annotations:
          label_ru: заменён
          label_en: superseded
          definition_ru: Заменён другим атомом или сущностью (связь supersedes).

  Rank:
    permissible_values:
      preferred:
        annotations:
          label_ru: основное
          label_en: preferred
          definition_ru: Основное значение среди нескольких.
      normal:
        annotations:
          label_ru: обычное
          label_en: normal
          definition_ru: Обычное значение.
      deprecated:
        annotations:
          label_ru: устаревшее
          label_en: deprecated
          definition_ru: Известное, но не рекомендуемое значение.

  ValueState:
    permissible_values:
      known:
        annotations:
          label_ru: известно
          label_en: known
          definition_ru: Значение задано.
      unknown:
        annotations:
          label_ru: неизвестно
          label_en: unknown
          definition_ru: Значение есть, но в источнике не названо.
      none:
        annotations:
          label_ru: нет
          label_en: none
          definition_ru: Значения нет — величина неприменима.

  SourceRole:
    permissible_values:
      primary:
        annotations: {label_ru: "первичный", label_en: "primary", definition_ru: "Первичный документ — норматив, каталог, проект, отчёт."}
      secondary:
        annotations: {label_ru: "вторичный", label_en: "secondary", definition_ru: "Пересказ — заметка, переписка, сводка."}
      derived:
        annotations: {label_ru: "вычислен", label_en: "derived", definition_ru: "Значение вычислено агентом по данным источника."}

  Visibility:
    permissible_values:
      private:
        annotations: {label_ru: "личное", label_en: "private", definition_ru: "Видно только автору."}
      department:
        annotations: {label_ru: "отдел", label_en: "department", definition_ru: "Видно отделу."}
      company:
        annotations: {label_ru: "компания", label_en: "company", definition_ru: "Видно всей компании."}

  ObjectKind:
    permissible_values:
      file:
        annotations: {label_ru: "файл", label_en: "file", definition_ru: "Файл, копия которого хранится по хэшу."}
      web:
        annotations: {label_ru: "страница сайта", label_en: "web page", definition_ru: "Адрес и дата обращения."}
      message:
        annotations: {label_ru: "переписка", label_en: "message", definition_ru: "Письмо или переписка — название и дата."}

  ObjectStatus:
    description: Что из объекта атомизировано (бывший реестр документов). Текущий статус — последняя отметка.
    permissible_values:
      parsed:
        annotations: {label_ru: "разобран", label_en: "parsed", definition_ru: "Всё нужное из источника атомизировано."}
      partial:
        annotations: {label_ru: "частично", label_en: "partial", definition_ru: "Атомизирована часть источника; какая — в заметке."}
      skipped:
        annotations: {label_ru: "пропущен", label_en: "skipped", definition_ru: "Источник просмотрен, атомизировать нечего; почему — в заметке."}

  SourceVerdict:
    description: >-
      Итог сверки источника с текстом файла (уровень 2 автопроверки). Значок в выдаче — ✓, ≈ или ⚠;
      у no_text и external значка нет.
    permissible_values:
      ok:
        annotations: {label_ru: "на месте", label_en: "ok", definition_ru: "Цитата найдена на указанной странице или страница не указана; одностраничный документ без цитаты — ссылка ведёт в нужный документ."}
      moved:
        annotations: {label_ru: "на другой странице", label_en: "moved", definition_ru: "Цитата найдена на другой странице; где именно — в source.page."}
      fuzzy:
        annotations: {label_ru: "приблизительно", label_en: "fuzzy", definition_ru: "Цитата найдена нечётким поиском: опечатка, другие кавычки."}
      by_locator:
        annotations: {label_ru: "по селектору", label_en: "by locator", definition_ru: "Цитаты нет, место найдено по селектору («табл. 11.1»)."}
      unresolved:
        annotations: {label_ru: "место не найдено", label_en: "unresolved", definition_ru: "Цитаты нет; селектора нет или он место не нашёл."}
      not_found:
        annotations: {label_ru: "цитата не найдена", label_en: "not found", definition_ru: "Цитаты в тексте файла нет."}
      no_file:
        annotations: {label_ru: "нет файла", label_en: "no file", definition_ru: "Файла нет в хранилище копий."}
      no_text:
        annotations: {label_ru: "нет текста", label_en: "no text", definition_ru: "У файла нет извлекаемого текста: скан, чертёж, модель."}
      external:
        annotations: {label_ru: "сайт или переписка", label_en: "external", definition_ru: "Источник без файла — страница сайта или переписка."}
      error:
        annotations: {label_ru: "сбой", label_en: "error", definition_ru: "Сбой при чтении или сверке файла."}

  ReviewState:
    permissible_values:
      none:
        annotations: {label_ru: "не требуется", label_en: "none", definition_ru: "Ревизия не ждёт человека."}
      pending:
        annotations: {label_ru: "ждёт", label_en: "pending", definition_ru: "Ревизия ждёт решения человека."}
      accepted:
        annotations: {label_ru: "принята", label_en: "accepted", definition_ru: "Человек принял ревизию."}
      declined:
        annotations: {label_ru: "отклонена", label_en: "declined", definition_ru: "Человек отклонил ревизию."}

  ChangesetState:
    permissible_values:
      approved:
        annotations: {label_ru: "принят", label_en: "approved", definition_ru: "Пакет прошёл уровни 1–2 и записан."}
      rejected:
        annotations: {label_ru: "отклонён", label_en: "rejected", definition_ru: "Ошибка уровня 1 или 2 — в базу ничего не записано."}

  ActivityKind:
    permissible_values:
      task:
        annotations: {label_ru: "задача", label_en: "task", definition_ru: "Инженерная задача."}
      wave:
        annotations: {label_ru: "волна переатомизации", label_en: "wave", definition_ru: "Волна переатомизации."}
      session:
        annotations: {label_ru: "сессия", label_en: "session", definition_ru: "Сессия агента без отдельной задачи."}
      migration:
        annotations: {label_ru: "миграция", label_en: "migration", definition_ru: "Служебная миграция данных."}

  Severity:
    permissible_values:
      violation:
        annotations: {label_ru: "ошибка", label_en: "violation", definition_ru: "Не даёт пройти проверку."}
      warning:
        annotations: {label_ru: "предупреждение", label_en: "warning", definition_ru: "Отправляет атом человеку."}
      info:
        annotations: {label_ru: "информация", label_en: "info", definition_ru: "Только сообщение."}

  CheckCode:
    description: Код замечания автопроверки; уровень и важность — в спецификации.
    permissible_values:
      schema:
        annotations: {label_ru: "схема", label_en: "schema", definition_ru: "Тело не проходит схему записи."}
      unknown_code:
        annotations: {label_ru: "неизвестный код", label_en: "unknown code", definition_ru: "Нет кода вида, класса, связи или типа селектора в загруженных пакетах."}
      ref_unknown:
        annotations: {label_ru: "ссылка в никуда", label_en: "unknown reference", definition_ru: "Ссылка на запись, которой нет."}
      template:
        annotations: {label_ru: "правило шаблона", label_en: "template", definition_ru: "Не выполнено правило поля шаблона."}
      ucum:
        annotations: {label_ru: "не код UCUM", label_en: "ucum", definition_ru: "Единица — не код UCUM."}
      unit_required:
        annotations: {label_ru: "нужна единица", label_en: "unit required", definition_ru: "Есть значение или границы, но нет единицы."}
      bounds_order:
        annotations: {label_ru: "порядок границ", label_en: "bounds order", definition_ru: "Нижняя граница больше верхней или значение вне границ."}
      link_not_allowed:
        annotations: {label_ru: "связь не разрешена", label_en: "link not allowed", definition_ru: "У шаблона нет такого вида исходящей связи."}
      link_required:
        annotations: {label_ru: "нет обязательной связи", label_en: "link required", definition_ru: "Нет обязательной связи шаблона."}
      link_pair:
        annotations: {label_ru: "концы связи не подходят", label_en: "link pair", definition_ru: "Концы связи не из пар её вида."}
      retired_record:
        annotations: {label_ru: "запись снята", label_en: "retired record", definition_ru: "Правка записи со статусом deprecated или superseded."}
      record_error:
        annotations: {label_ru: "отказ записи", label_en: "record error", definition_ru: "Поздний отказ записи пакета."}
      source_unresolved:
        annotations: {label_ru: "источник не разобран", label_en: "source unresolved", definition_ru: "Путь источника не разобрался."}
      version_missing:
        annotations: {label_ru: "нет версии", label_en: "version missing", definition_ru: "У объекта нет указанной версии."}
      digest_mismatch:
        annotations: {label_ru: "не тот digest", label_en: "digest mismatch", definition_ru: "Digest не совпадает с версией объекта."}
      pdf_page_required:
        annotations: {label_ru: "нужна страница PDF", label_en: "pdf page required", definition_ru: "У источника из PDF нет селектора страницы."}
      pdf_quote_required:
        annotations: {label_ru: "нужна цитата из PDF", label_en: "pdf quote required", definition_ru: "У источника из PDF нет цитаты или она слишком короткая."}
      quote_not_found:
        annotations: {label_ru: "цитата не найдена", label_en: "quote not found", definition_ru: "Цитата задана, но в тексте её нет."}
      quote_fuzzy:
        annotations: {label_ru: "цитата приблизительно", label_en: "quote fuzzy", definition_ru: "Цитата найдена только нечётким поиском."}
      number_not_found:
        annotations: {label_ru: "числа нет во фрагменте", label_en: "number not found", definition_ru: "Числа атома нет во фрагменте источника."}
      page_moved:
        annotations: {label_ru: "страница исправлена", label_en: "page moved", definition_ru: "Цитата на другой странице; номер исправлен."}
      place_unresolved:
        annotations: {label_ru: "место не найдено", label_en: "place unresolved", definition_ru: "Цитаты нет, и место не найдено."}
      no_text:
        annotations: {label_ru: "нет текста", label_en: "no text", definition_ru: "У файла нет извлекаемого текста."}
      external_source:
        annotations: {label_ru: "сайт или переписка", label_en: "external source", definition_ru: "Источник — страница сайта или переписка."}
      source_error:
        annotations: {label_ru: "сбой источника", label_en: "source error", definition_ru: "Сбой извлечения или сверки."}
      numbers_unchecked:
        annotations: {label_ru: "числа не сверены", label_en: "numbers unchecked", definition_ru: "Числа не с чем сверить: нет фрагментов."}
      edition_filled:
        annotations: {label_ru: "редакция подставлена", label_en: "edition filled", definition_ru: "Редакция подставлена по файлу."}
      unknown_property:
        annotations: {label_ru: "неизвестная величина", label_en: "unknown property", definition_ru: "Кода величины нет в словаре величин."}
      out_of_range:
        annotations: {label_ru: "вне диапазона", label_en: "out of range", definition_ru: "Значение вне правдоподобного диапазона величины."}
      unit_mismatch:
        annotations: {label_ru: "единица не сходится", label_en: "unit mismatch", definition_ru: "Единицу значения нельзя перевести в единицу величины."}
      conflict:
        annotations: {label_ru: "конфликт значений", label_en: "conflict", definition_ru: "Другое значение той же величины у той же сущности при тех же условиях."}
      duplicate:
        annotations: {label_ru: "дубль", label_en: "duplicate", definition_ru: "Похоже на существующую запись или запись той же пачки."}
      related:
        annotations: {label_ru: "похожие записи", label_en: "related", definition_ru: "Похожие записи ниже порога дубля."}
      basis_author_model:
        annotations: {label_ru: "автор — модель", label_en: "basis author model", definition_ru: "basis author у записи модели."}
      basis_without_rule:
        annotations: {label_ru: "основание без правила", label_en: "basis without rule", definition_ru: "basis default или assumed без derived_from."}
      confidence_person:
        annotations: {label_ru: "уверенность у человека", label_en: "confidence person", definition_ru: "confidence заполнил человек."}
      bundle_pack_missing:
        annotations: {label_ru: "нет пакета подборки", label_en: "bundle pack missing", definition_ru: "Пакет подборки не загружен или digest иной."}
      bundle_key_collision:
        annotations: {label_ru: "ключ занят", label_en: "bundle key collision", definition_ru: "key записи подборки принадлежит другой записи, или id связи подборки занят связью с другими rel или концами."}
      bundle_object_conflict:
        annotations: {label_ru: "объект не сопоставлен", label_en: "bundle object conflict", definition_ru: "Файл подборки известен базе под другим id лишь частично: не все версии, на которые ссылаются источники, найдены по digest, или версии ведут на разные локальные объекты."}

  ReviewReason:
    description: Почему запись попала в очередь проверки.
    permissible_values:
      semantic:
        annotations: {label_ru: "смысл", label_en: "semantic", definition_ru: "Атом draft ждёт смысловой проверки."}
      warning:
        annotations: {label_ru: "предупреждение", label_en: "warning", definition_ru: "Предупреждения уровней 1–4."}
      high_risk:
        annotations: {label_ru: "высокий риск", label_en: "high risk", definition_ru: "Риск записи требует человека."}
      semantic_doubt:
        annotations: {label_ru: "сомнение модели", label_en: "semantic doubt", definition_ru: "Смысловая проверка не подтвердила."}
      edit:
        annotations: {label_ru: "правка", label_en: "edit", definition_ru: "Правка записи, уже проверенной человеком."}
      source_changed:
        annotations: {label_ru: "источник изменился", label_en: "source changed", definition_ru: "Ссылка на старую версию объекта."}
      audit:
        annotations: {label_ru: "аудит", label_en: "audit", definition_ru: "Выборка аудита."}
      calibration:
        annotations: {label_ru: "калибровка", label_en: "calibration", definition_ru: "Поставлен вручную."}
      imported:
        annotations: {label_ru: "из другой базы", label_en: "imported", definition_ru: "Пришло подборкой из другой базы."}

  ReviewItemState:
    permissible_values:
      queued:
        annotations: {label_ru: "в очереди", label_en: "queued", definition_ru: "Ждёт проверяющего."}
      claimed:
        annotations: {label_ru: "захвачен", label_en: "claimed", definition_ru: "Захвачен проверяющим на время аренды."}
      done:
        annotations: {label_ru: "решён", label_en: "done", definition_ru: "Есть вердикт."}
      obsolete:
        annotations: {label_ru: "устарел", label_en: "obsolete", definition_ru: "Закрыт без вердикта: запись изменилась."}

  VerificationMethod:
    permissible_values:
      llm_judge:
        annotations: {label_ru: "модель", label_en: "llm judge", definition_ru: "Вердикт модели (агент model:)."}
      human:
        annotations: {label_ru: "человек", label_en: "human", definition_ru: "Вердикт человека (агент person:)."}

  VerificationOutcome:
    permissible_values:
      confirmed:
        annotations: {label_ru: "подтверждено", label_en: "confirmed", definition_ru: "Запись верна."}
      partial:
        annotations: {label_ru: "частично", label_en: "partial", definition_ru: "Верна частично."}
      refuted:
        annotations: {label_ru: "опровергнуто", label_en: "refuted", definition_ru: "Запись неверна."}
      uncertain:
        annotations: {label_ru: "неясно", label_en: "uncertain", definition_ru: "Проверяющий не смог решить."}

  HighRiskRule:
    description: Правило шаблона, по которому запись считается рискованной.
    permissible_values:
      always:
        annotations: {label_ru: "всегда", label_en: "always", definition_ru: "Записи этого вида всегда уходят к человеку."}
      numeric:
        annotations: {label_ru: "числовой", label_en: "numeric", definition_ru: "Записи с числовыми значениями уходят к человеку."}
      low_confidence:
        annotations: {label_ru: "низкая уверенность", label_en: "low confidence", definition_ru: "Записи с confidence ниже порога уходят к человеку."}

  Basis:
    description: Основание значения, когда оно не взято из документа об объекте.
    permissible_values:
      default:
        annotations: {label_ru: "умолчание", label_en: "default", definition_ru: "Умолчание методики — принято по правилу области «в запас», не из документа об объекте."}
      assumed:
        annotations: {label_ru: "допущение", label_en: "assumed", definition_ru: "Принято без решения по объекту, чтобы продолжить работу; требует подтверждения."}
      author:
        annotations: {label_ru: "утверждение автора", label_en: "author", definition_ru: "Человек утверждает это сам; документа нет. Доступно только агенту person:."}

  TemplateTarget:
    permissible_values:
      atom: {}
      entity: {}
      link: {}

  CardState:
    description: Состояние поля карточки amem.card/1 (спецификация 3c, разд. 3.4).
    permissible_values:
      known:
        annotations: {label_ru: "известно", label_en: "known", definition_ru: "Одно действующее значение или одно preferred среди нескольких."}
      missing:
        annotations: {label_ru: "нет", label_en: "missing", definition_ru: "Значения нет или документ величину не называет (value_state unknown)."}
      asked:
        annotations: {label_ru: "спрошено", label_en: "asked", definition_ru: "Значения нет, но есть действующий вопрос о величине."}
      na:
        annotations: {label_ru: "не относится", label_en: "not applicable", definition_ru: "Величина к объекту не относится (value_state none)."}
      conflict:
        annotations: {label_ru: "расхождение", label_en: "conflict", definition_ru: "Несколько различных значений, ни одно не preferred."}

  KindFamily:
    description: >-
      Семья вида атома (Concept.family, спецификация подпроекта 4, разд. 1.2): откуда знание — из документа или
      из работы. По ней интерфейс группирует виды и раскрашивает граф. Вид без family считается work.
    permissible_values:
      source:
        annotations: {label_ru: "источник", label_en: "source", definition_ru: "Знание взято из документа: факт, параметр, термин, требование, норма, формула."}
      work:
        annotations: {label_ru: "работа", label_en: "work", definition_ru: "Знание появилось в работе: решение, урок, методика, вопрос, заметка."}

classes:
  Any:
    class_uri: linkml:Any
    description: Любое значение (ячейка таблицы, отчёт проверки).

  LangString:
    description: Текст на нескольких языках; русский обязателен.
    attributes:
      ru:
        required: true
      en: {}

  Selector:
    description: Место внутри файла. refined_by уточняет его — лист → диапазон, страница → цитата.
    attributes:
      type:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        required: true
      value:
        required: true
      label:
        description: Как место подписано в документе — «л. 24–25».
      refined_by:
        range: Selector
        inlined: true

  Source:
    description: >-
      Источник: объект + версия + селекторы + цитата. Во входных данных агент даёт path (путь в папке документов),
      сервер заменяет его на object, object_version и digest.
    attributes:
      path:
        description: Путь в папке документов или название письма / адрес сайта. Только во входных данных.
      object:
        pattern: '^obj:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      object_version:
        range: integer
        minimum_value: 1
      digest:
        pattern: '^sha256:[0-9a-f]{64}$'
      selectors:
        range: Selector
        multivalued: true
        inlined_as_list: true
      quote:
        description: Дословная цитата в пределах одной страницы — её сверяет с файлом проверка уровня 2. Для PDF обязательна.
      edition:
        description: Редакция документа — сущность класса edition.
        pattern: '^(ent:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      role:
        range: SourceRole

  Value:
    description: Величина (Wikidata Quantity + UCUM). property — код из словаря property.
    attributes:
      property:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      label:
        range: LangString
        inlined: true
      amount:
        range: float
      lower_bound:
        range: float
      upper_bound:
        range: float
      unit:
        description: Код UCUM с учётом регистра — kPa, mm, W/(m2.K), Cel, 1.
      quantity_kind:
        description: Род величины QUDT — Pressure, Length.
      value_text:
        description: Нечисловое значение — ветровой район «II».
      value_state:
        range: ValueState
      note:
        range: LangString
        inlined: true
      qualifiers:
        range: Qualifier
        multivalued: true
        inlined_as_list: true

  Qualifier:
    description: Условие применимости (уточнение в духе Wikidata).
    attributes:
      property:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      label:
        range: LangString
        inlined: true
      value_text: {}
      amount:
        range: float
      lower_bound:
        range: float
      upper_bound:
        range: float
      unit: {}
      value_state:
        range: ValueState

  Symbol:
    attributes:
      symbol:
        required: true
      label:
        range: LangString
        inlined: true
      term:
        description: Атом-термин с определением обозначения.
        pattern: '^(atm:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      unit: {}

  Formula:
    attributes:
      latex:
        required: true
      plain: {}
      symbols:
        range: Symbol
        multivalued: true
        inlined_as_list: true

  Column:
    attributes:
      code:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      label:
        range: LangString
        required: true
        inlined: true
      unit: {}

  Table:
    description: Таблица целиком. rows — список строк, каждая строка — список значений по columns.
    attributes:
      columns:
        range: Column
        multivalued: true
        inlined_as_list: true
        required: true
      rows:
        range: Any
        multivalued: true

  Content:
    description: Форма записи — одна или несколько.
    attributes:
      values:
        range: Value
        multivalued: true
        inlined_as_list: true
      formula:
        range: Formula
        inlined: true
      table:
        range: Table
        inlined: true

  Scope:
    attributes:
      project:
        pattern: '^(ent:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      discipline:
        multivalued: true
        pattern: '^[a-z][a-z0-9_]*$'
      visibility:
        range: Visibility

  ExternalIds:
    attributes:
      bsdd: {}
      wikidata: {}
      ifc: {}

  Provenance:
    description: Происхождение записи при переносе между базами (задел под хаб, разд. 5 спеки amem).
    attributes:
      origin_base:
        description: >-
          base_id базы, из которой атом пришёл при разворачивании проекта в собственную базу.
          Заполняется только при импорте из другой базы; не ссылка — UUID-строка.
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      origin_revision_hash:
        description: content_hash ревизии в базе-источнике — по нему повторный импорт узнаёт то же содержание.
        pattern: '^sha256-c[1-9][0-9]*:[0-9a-f]{64}$'
      origin_agent:
        pattern: '^(person|model):[a-z0-9_.-]+$'

  AtomPayload:
    description: >-
      Тело атома — что предлагает агент. В ревизии хранится в канонической форме: без ref и path,
      ссылки — только по UUID, у источника object, object_version и digest (проверяет этап 2).
    attributes:
      ref:
        description: Временное имя в пачке (@имя) для ссылок внутри неё. В ревизию не записывается.
        pattern: '^@[a-z0-9_]+$'
      key:
        description: Необязательный читаемый ключ.
        pattern: '^[a-z0-9][a-z0-9_.]*$'
      kind:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        required: true
      label:
        range: LangString
        required: true
        inlined: true
      summary_plain:
        range: LangString
        inlined: true
      body:
        range: LangString
        inlined: true
      aliases:
        multivalued: true
      codes:
        description: Марки, обозначения, символы целиком — m10, dn50, w0, 10.1.
        multivalued: true
      retrieval_context:
        description: Фраза агента к контексту поиска; остальное сервер собирает сам.
        range: LangString
        inlined: true
      content:
        range: Content
        inlined: true
      qualifiers:
        range: Qualifier
        multivalued: true
        inlined_as_list: true
      about:
        multivalued: true
        pattern: '^(ent:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      sources:
        range: Source
        multivalued: true
        inlined_as_list: true
      rank:
        range: Rank
      valid_from:
        range: date
      valid_to:
        range: date
      scope:
        range: Scope
        inlined: true
      tags:
        description: "Свободные метки. Приставка вида «объект:…» запрещена — это about."
        multivalued: true
        pattern: '^(?![^\s:]+:).+$'
      derived_from:
        multivalued: true
        pattern: '^(atm:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      provenance:
        description: Происхождение атома при переносе из другой базы; у своих атомов поля нет.
        range: Provenance
        inlined: true
      basis:
        description: Основание значения без документа; при заданном basis источник не обязателен (has_source 1.1.0).
        range: Basis
      confidence:
        description: Уверенность агента-модели в утверждении (распознавание, извлечение). Человек поле не заполняет.
        range: float
        minimum_value: 0
        maximum_value: 1

  Atom:
    is_a: AtomPayload
    description: Атом в выдаче сервера — тело текущей ревизии + технические поля, которые ставит сервер.
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      schema_version:
        pattern: '^amem\.atom/[0-9]+$'
      revision:
        range: integer
        minimum_value: 1
      content_hash:
        description: Хэш канонического тела ревизии; метка cN — версия правил канонизации (сейчас c1, amem/canon.py).
        pattern: '^sha256-c[1-9][0-9]*:[0-9a-f]{64}$'
      status:
        range: Status
      review_state:
        range: ReviewState
      created_at:
        range: datetime
      recorded_at:
        range: datetime
      changeset:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      agent:
        pattern: '^(person|model):[a-z0-9_.-]+$'
      activity:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  EntityPayload:
    description: >-
      Вещь — объект, система, изделие, узел, материал, норматив, редакция, документ.
      В ревизии хранится в канонической форме: без ref и path, ссылки — только по UUID,
      у источника object, object_version и digest (проверяет этап 2).
    attributes:
      ref:
        pattern: '^@[a-z0-9_]+$'
      key:
        pattern: '^[a-z0-9][a-z0-9_.]*$'
      entity_class:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        required: true
      label:
        range: LangString
        required: true
        inlined: true
      aliases:
        multivalued: true
      codes:
        multivalued: true
      description:
        range: LangString
        inlined: true
      external_ids:
        range: ExternalIds
        inlined: true
      edition_of:
        description: Только у класса edition — норматив или документ, редакцией которого она является.
        pattern: '^(ent:([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      valid_from:
        range: date
      valid_to:
        range: date
      sources:
        description: Файлы, которыми представлена сущность (для документа и редакции), или откуда она известна.
        range: Source
        multivalued: true
        inlined_as_list: true

  Entity:
    is_a: EntityPayload
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      schema_version:
        pattern: '^amem\.entity/[0-9]+$'
      revision:
        range: integer
        minimum_value: 1
      content_hash:
        description: Хэш канонического тела ревизии; метка cN — версия правил канонизации (сейчас c1, amem/canon.py).
        pattern: '^sha256-c[1-9][0-9]*:[0-9a-f]{64}$'
      status:
        range: Status
      review_state:
        range: ReviewState
      created_at:
        range: datetime
      recorded_at:
        range: datetime
      changeset:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      agent:
        pattern: '^(person|model):[a-z0-9_.-]+$'
      activity:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'

  LinkPayload:
    attributes:
      rel:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        required: true
      src:
        required: true
        pattern: '^((atm|ent):([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      dst:
        required: true
        pattern: '^((atm|ent):([0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[a-z0-9][a-z0-9_.]*)|@[a-z0-9_]+)$'
      note:
        range: LangString
        inlined: true
      qualifiers:
        range: Qualifier
        multivalued: true
        inlined_as_list: true
      confidence:
        range: float
        minimum_value: 0
        maximum_value: 1

  Link:
    is_a: LinkPayload
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      created_at:
        range: datetime
      changeset:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      agent:
        pattern: '^(person|model):[a-z0-9_.-]+$'
      retired_at:
        range: datetime

  ObjectVersion:
    attributes:
      n:
        range: integer
        required: true
        minimum_value: 1
      digest:
        pattern: '^sha256:[0-9a-f]{64}$'
      size:
        range: integer
        minimum_value: 0
      recorded_at:
        range: datetime

  ObjectRecord:
    description: Объект — файл (копия по хэшу), страница сайта или переписка.
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      kind:
        range: ObjectKind
        required: true
      original_name: {}
      media_type: {}
      format_puid: {}
      url: {}
      retrieved_at:
        range: date
      logical_paths:
        multivalued: true
      versions:
        range: ObjectVersion
        multivalued: true
        inlined_as_list: true

  Bundle:
    description: Пачка предложений агента — один пакет изменений (kb_add, kb_import).
    attributes:
      reason:
        description: Основание — что за документ или задача.
      activity:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      entities:
        range: EntityPayload
        multivalued: true
        inlined_as_list: true
      atoms:
        range: AtomPayload
        multivalued: true
        inlined_as_list: true
      links:
        range: LinkPayload
        multivalued: true
        inlined_as_list: true

  Concept:
    description: Понятие словаря (SKOS).
    attributes:
      scheme:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      code:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      label:
        range: LangString
        required: true
        inlined: true
      definition:
        range: LangString
        inlined: true
      inverse_label:
        range: LangString
        inlined: true
      broader:
        pattern: '^[a-z][a-z0-9_]*$'
      status:
        range: Status
      unit: {}
      quantity_kind: {}
      plausible_min:
        range: float
      plausible_max:
        range: float
      pairs:
        description: Допустимые пары концов связи «от>к» — atom>entity.
        multivalued: true
        pattern: '^(atom|entity)>(atom|entity)$'
      symmetric:
        range: boolean
      via_field: {}
      family:
        description: Семья вида атома — только у понятий scheme kind; без неё вид считается work.
        range: KindFamily

  FieldRule:
    description: >-
      Правило шаблона для поля. path — через точку; [] — каждый элемент списка, ставится у промежуточных списков
      (sources[].edition). Правило с [] относится к каждому элементу: у нормы каждый источник — сам документ.
      required — поле непустое: список — хотя бы один элемент, текст — непустой ru, объект — хотя бы одно непустое поле.
      min_count — не меньше N элементов (для N больше 1; для одного — required).
      selector_types — хотя бы один селектор из перечня, с учётом цепочки refined_by.
      entity_classes — класс сущности, на которую ведёт ссылка. ucum — значение — код UCUM.
      severity по умолчанию — violation.
    attributes:
      path:
        required: true
        pattern: '^[a-z_][a-z0-9_]*(\[\])?(\.[a-z_][a-z0-9_]*(\[\])?)*$'
      required:
        range: boolean
      min_count:
        range: integer
        minimum_value: 0
      severity:
        range: Severity
      ucum:
        range: boolean
      selector_types:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        multivalued: true
      entity_classes:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        multivalued: true
      skip_if_set:
        description: Путь до поля того же тела; если оно непусто, правило не применяется.
        pattern: '^[a-z_][a-z0-9_]*(\.[a-z_][a-z0-9_]*)*$'
      message:
        range: LangString
        inlined: true

  RequiredLink:
    attributes:
      rel:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        required: true
      to_classes:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        multivalued: true
      severity:
        range: Severity

  LinkRules:
    description: >-
      Связи атома этого вида. allowed — какие исходящие связи разрешены (входящие не ограничиваются);
      исходящая связь другого вида — нарушение violation. required — хотя бы одна связь этого вида,
      а при to_classes — к сущности одного из этих классов; about и derived_from проверяются по полям атома.
      severity по умолчанию — violation.
    attributes:
      allowed:
        range: string
        pattern: '^[a-z][a-z0-9_]*$'
        multivalued: true
      required:
        range: RequiredLink
        multivalued: true
        inlined_as_list: true

  ParameterRule:
    description: >-
      Правило профиля сущности: какая величина нужна объекту этого класса. required — блокер; default — умолчание
      области (в карточке показывается, значением не считается); origin — код словаря parameter_origin.
    attributes:
      property: {required: true, pattern: '^[a-z][a-z0-9_]*$'}
      required: {range: boolean}
      group: {pattern: '^[a-z][a-z0-9_]*$'}
      origin: {pattern: '^[a-z][a-z0-9_]*$'}
      default: {range: ParameterDefault, inlined: true}
      ask: {range: LangString, inlined: true}
      hint: {range: LangString, inlined: true}
      when: {range: LangString, inlined: true}

  ParameterDefault:
    attributes:
      amount: {range: float}
      unit: {}
      value_text: {}

  CardField:
    description: >-
      Поле карточки: правило профиля и выведенное по действующим атомам parameter состояние. У known — значение
      и признаки (status, by, basis, rank, confidence, source_role, sources) — у лучшего из атомов с этим значением
      (verified, затем человек, затем новее); candidates — остальные значения, кроме rank deprecated.
      Карточка не хранится — класс только описывает формат (JSON Schema).
    attributes:
      property: {required: true, pattern: '^[a-z][a-z0-9_]*$'}
      required: {range: boolean, required: true}
      group: {}
      origin: {}
      rule:
        description: Шаблон, чьё правило действует (code@version).
      default: {range: Any}
      ask: {range: LangString, inlined: true}
      hint: {range: LangString, inlined: true}
      when: {range: LangString, inlined: true}
      state: {range: CardState, required: true}
      value: {range: Any}
      atoms:
        multivalued: true
        pattern: '^atm:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      candidates: {range: Any, multivalued: true}
      status: {range: Status}
      by:
        pattern: '^(person|model)$'
      basis: {range: Basis}
      rank: {range: Rank}
      confidence: {range: float}
      source_role: {range: SourceRole}
      sources: {range: Any, multivalued: true}

  Card:
    description: >-
      Карточка сущности amem.card/1 (profile.card): поля профиля её класса, величины вне профиля (extra),
      сводка и карточки предков по part_of. Вычисляется, не хранится.
    attributes:
      format: {required: true, pattern: '^amem\.card/1$'}
      entity: {range: Any, required: true}
      profile:
        description: Шаблон класса с профилем (code@version) или пусто, если профиля нет.
      templates: {multivalued: true}
      fields:
        range: CardField
        multivalued: true
        inlined_as_list: true
      extra: {range: Any, multivalued: true}
      summary: {range: Any, required: true}
      ancestors: {range: Any, multivalued: true}

  BundleManifest:
    description: >-
      Манифест подборки amem.bundle/1 (bundle.export, файл manifest.json): откуда и что отобрано, пакеты, состав
      и sha256 каждого файла подборки (parts). Пишется последним; bundle.inspect сверяет части без базы.
    attributes:
      format: {required: true, pattern: '^amem\.bundle/1$'}
      created_at: {range: datetime, required: true}
      base_id:
        required: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      agent:
        required: true
        pattern: '^(person|model):[a-z0-9_.-]+$'
      amem_version: {required: true}
      selection: {range: Any, required: true}
      packs:
        description: Пакеты, которым принадлежат коды записей, с зависимостями — name, version, digest, requires.
        range: Any
        multivalued: true
        required: true
      counts: {range: Any, required: true}
      parts:
        description: Путь файла в подборке → sha256 (hex); все файлы, кроме самого манифеста.
        range: Any
        required: true
      with_files: {range: boolean, required: true}
      with_history: {range: boolean, required: true}
      with_packs: {range: boolean, required: true}

  Template:
    description: >-
      Шаблон вида атома, класса сущности или вида связи (applies_to) — или интерфейс (applies_to пуст):
      интерфейс действует на все записи своего target, даже если у вида нет своего шаблона.
      extends — интерфейсы и шаблоны того же target, без циклов; применяются слева направо, затем свои правила.
      Правила сводятся по path: правило потомка заменяет правило предка с тем же path. Данные с версией (semver).
    attributes:
      code:
        required: true
        pattern: '^[a-z][a-z0-9_]*$'
      version:
        required: true
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      target:
        range: TemplateTarget
        required: true
      applies_to:
        pattern: '^[a-z][a-z0-9_]*$'
      extends:
        multivalued: true
        pattern: '^[a-z][a-z0-9_]*$'
      description:
        range: LangString
        inlined: true
      fields:
        range: FieldRule
        multivalued: true
        inlined_as_list: true
      links:
        range: LinkRules
        inlined: true
      high_risk:
        range: HighRiskRule
        multivalued: true
      parameters:
        description: Профиль параметров — только у target entity.
        range: ParameterRule
        multivalued: true
        inlined_as_list: true

  Agent:
    attributes:
      id:
        identifier: true
        pattern: '^(person|model):[a-z0-9_.-]+$'
      name: {}

  Activity:
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      kind:
        range: ActivityKind
        required: true
      label: {}
      started_at:
        range: datetime
      ended_at:
        range: datetime

  Changeset:
    attributes:
      id:
        identifier: true
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      agent:
        required: true
        pattern: '^(person|model):[a-z0-9_.-]+$'
      activity:
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      reason: {}
      state:
        range: ChangesetState
        required: true
      check_report:
        range: Any
      created_at:
        range: datetime

  CheckIssue:
    description: Замечание автопроверки.
    attributes:
      level: {range: integer, required: true, minimum_value: 1, maximum_value: 4}
      severity: {range: Severity, required: true}
      code: {range: CheckCode, required: true}
      where: {required: true}
      message: {required: true}
      details: {range: Any}

  CheckReport:
    description: Отчёт пакета; пишется в changeset.check_report до записи ревизий.
    attributes:
      format: {required: true, pattern: '^amem\.check/1$'}
      levels: {range: Any, required: true}
      issues: {range: CheckIssue, multivalued: true, inlined_as_list: true}
      degraded: {range: Any, multivalued: true}
      templates: {multivalued: true}
      records: {range: Any, multivalued: true}

  ReviewItem:
    description: Пункт очереди проверки. Ревизия — атома или сущности, по target.
    attributes:
      id: {identifier: true, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      target: {required: true, pattern: '^(atom|entity)$'}
      record_id: {required: true, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      revision_id: {required: true, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      reason: {range: ReviewReason, required: true}
      state: {range: ReviewItemState, required: true}
      changeset_id: {pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      details: {range: Any}
      created_at: {range: datetime, required: true}
      created_by: {required: true, pattern: '^(person|model):[a-z0-9_.-]+$'}
      claimed_by: {pattern: '^(person|model):[a-z0-9_.-]+$'}
      claimed_until: {range: datetime}
      closed_at: {range: datetime}

  Verification:
    description: Вердикт по пункту очереди; неизменяемый.
    attributes:
      id: {identifier: true, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      review_item_id: {required: true, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
      method: {range: VerificationMethod, required: true}
      outcome: {range: VerificationOutcome, required: true}
      confidence: {range: float, minimum_value: 0, maximum_value: 1}
      agent: {required: true, pattern: '^(person|model):[a-z0-9_.-]+$'}
      note: {}
      created_at: {range: datetime, required: true}
