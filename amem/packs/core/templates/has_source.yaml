code: has_source
version: 1.1.0
target: atom
description: {ru: "Интерфейс для всех видов атомов: у атома есть источник и место в нём — если не задано основание basis (умолчание, допущение, утверждение автора). Что у PDF обязательны страница и дословная цитата, проверяет уровень 2 по виду файла — шаблоном это не выразить."}
fields:
  - path: sources
    required: true
    severity: violation
    skip_if_set: basis
    message: {ru: "У атома нет источника и не задано основание basis."}
  - path: sources[].selectors
    required: true
    severity: warning
    skip_if_set: basis
    message: {ru: "Не указано место в источнике — страница, пункт, лист."}
