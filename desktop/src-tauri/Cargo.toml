[package]
name = "amemo-desktop"
version = "0.0.0"            # версия приложения — в tauri.conf.json (её задаёт сборка из amemo/__init__.py)
description = "amemo for Windows: installer, window and tray"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"          # tauri::generate_context! ссылается на него
# те же версии и TLS, что у tauri-plugin-updater (rustls с ring): вторых копий и второго TLS в сборке нет
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { version = "1", features = ["sync", "time"] }
dirs = "7"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
