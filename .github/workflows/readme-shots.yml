name: readme-shots
# Снимки экрана README с настоящей службы на образцах: en — tools/seed_sample_en.py, ru — tools/seed_sample.py.
# Результат — артефакты readme-shots-<язык> (снимки PNG) и readme-gifs-<язык> (анимации сцен, web/tools/readme-gifs.mjs);
# в репозиторий их кладут руками (docs/assets/readme/<язык>/). Анимации идут после снимков: сцены меняют базу.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/seed_sample*.py"
      - "tools/sample_en/**"
      - "tools/sample-pack/**"
      - "web/tools/readme-shots.mjs"
      - "web/tools/readme-gifs.mjs"
      - "tools/readme_agent_session.py"
      - ".github/workflows/readme-shots.yml"

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-24.04          # шрифты снимков постоянны; у образа 26.04 apt (amd64v3) падал на DNS
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: en
            seed: tools/seed_sample_en.py
            packs: tools/sample_en/pack
            query: TH-20 humidity accuracy
            prompt: How accurate is the TH-20 humidity reading near saturation? Cite the source.
          - lang: ru
            seed: tools/seed_sample.py
            packs: tools/sample-pack/meteo
            query: Погрешность влажности В-2
            prompt: Какая погрешность у В-2 у верхнего края шкалы? Со ссылкой на источник.
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg18
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AMEMO_DSN: postgresql://test:test@127.0.0.1:5432/test
      AMEMO_DATA: /tmp/sample/objects
      AMEMO_DOCS: /tmp/sample/docs
      AMEMO_STATE: /tmp/sample/state
      AMEMO_AGENT: person:sample
      AMEMO_PORT: "8770"
      AMEMO_BACKEND: none
      SHOT_LANG: ${{ matrix.lang }}
      SHOT_SEED: ${{ matrix.seed }}
      SHOT_PACKS: ${{ matrix.packs }}
      SHOT_QUERY: ${{ matrix.query }}
      SHOT_PROMPT: ${{ matrix.prompt }}
      AGENT_TRANSCRIPT: /tmp/agent.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: amemo and amemo-web wheels in a clean venv
        run: |
          pip install -q build
          python -m build -q --wheel -o wheels .
          python -m build -q --wheel -o wheels web/python
          python -m venv /tmp/amemo
          /tmp/amemo/bin/pip install -q wheels/amemo-*.whl wheels/amemo_web-*.whl
      - name: Seed the sample
        run: |
          mkdir -p "$AMEMO_DOCS" "$AMEMO_DATA" "$AMEMO_STATE"
          if [ -n "$SHOT_PACKS" ]; then echo "AMEMO_PACKS=$GITHUB_WORKSPACE/$SHOT_PACKS" >> "$GITHUB_ENV"; fi
          if [ -n "$SHOT_PACKS" ]; then export AMEMO_PACKS="$GITHUB_WORKSPACE/$SHOT_PACKS"; fi
          /tmp/amemo/bin/python "$SHOT_SEED"
      - name: Start the service
        run: |
          nohup /tmp/amemo/bin/python -m amemo.service > /tmp/service.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8770/api/v1/base >/dev/null && exit 0; sleep 1; done
          cat /tmp/service.log; exit 1
      - name: Agent session over MCP (amemo mcp, stdio)
        run: /tmp/amemo/bin/python tools/readme_agent_session.py "$AGENT_TRANSCRIPT" --query "$SHOT_QUERY" --prompt "$SHOT_PROMPT"
      - name: Chromium
        working-directory: web
        # системные пакеты — через apt; зеркала Ubuntu бывают недоступны с машин GitHub, а нужные Chromium
        # библиотеки на образе уже есть — тогда только сам браузер
        run: timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Screens
        working-directory: web
        run: node tools/readme-shots.mjs http://127.0.0.1:8770 "$SHOT_LANG"
      - uses: actions/upload-artifact@v4
        with:
          name: readme-shots-${{ matrix.lang }}
          path: docs/assets/readme/${{ matrix.lang }}/*.png
          retention-days: 14
      - name: ffmpeg
        # статическая сборка с PyPI, без apt: зеркала Ubuntu бывают недоступны с машин GitHub
        run: |
          command -v ffmpeg && exit 0
          python -m pip install -q imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ffmpeg" -hide_banner -filters | grep -E "palettegen|paletteuse"
      - name: Usage GIFs
        working-directory: web
        run: |
          rm -f ../docs/assets/readme/"$SHOT_LANG"/demo-*.gif   # иначе упавший прогон выложил бы старые GIF из репозитория
          node tools/readme-gifs.mjs http://127.0.0.1:8770 "$SHOT_LANG"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-gifs-${{ matrix.lang }}
          path: |
            docs/assets/readme/${{ matrix.lang }}/*.gif
            docs/assets/readme/${{ matrix.lang }}/failed-*.png
          retention-days: 14
      - if: failure()
        run: cat /tmp/service.log || true
