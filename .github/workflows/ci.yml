name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # На pull request — только PostgreSQL 18 (вдвое быстрее); обе версии — на push в main.
      AMEM_TEST_DSNS: ${{ github.event_name == 'pull_request' && 'postgresql://test:test@localhost:5433/test' || 'postgresql://test:test@localhost:5433/test,postgresql://test:test@localhost:5434/test' }}
    defaults:
      run:
        shell: bash          # явный bash — это bash -eo pipefail: упавший pytest | tee валит шаг
    services:
      # тестовые базы, как в docker-compose.yml: 18 на 5433, 16 на 5434
      db-test:
        image: pgvector/pgvector:0.8.1-pg18
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      db-test-pg16:
        image: pgvector/pgvector:0.8.1-pg16
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client 18 (pg_dump, pg_restore, psql) for backup tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18 && break
            echo "apt: попытка $attempt не удалась"; sleep 15
            [ "$attempt" = 3 ] && exit 1
          done
          echo "AMEM_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - run: ruff check amem tests tools
      - run: pytest -q -p no:cacheprovider -rA | tee pytest.log
      - name: Restore tests ran once on PostgreSQL 18 and once on 16
        run: |
          for test in test_dump_restores_records_marks_and_search test_snapshot_restore_opens_the_old_file_version test_verify_restores_into_a_temporary_database_and_searches; do
            for db in $(echo "$AMEM_TEST_DSNS" | tr ',' '\n' | sed -E 's#.*:([0-9]+)/.*#pg\1#'); do
              n=$(grep -c "^PASSED tests/test_backup_restore.py::${test}\[${db}\]" pytest.log || true)
              [ "$n" = 1 ] || { echo "${test}[${db}]: passed $n times"; exit 1; }
            done
          done
      - run: python tools/gen_schema.py --check
      - name: One command — amem init, amem install claude-code --project, amem doctor
        run: |
          PGPASSWORD=test "$AMEM_PG_BIN/psql" -h localhost -p 5433 -U test -d test -qc "CREATE DATABASE onecmd"
          export HOME="$(mktemp -d)" AMEM_BACKEND=none
          project="$(mktemp -d)"
          amem init --dsn postgresql://test:test@localhost:5433/onecmd
          amem install claude-code --project "$project"
          cd "$project"
          amem doctor --project "$project"
          amem doctor --project "$project" --json > "$RUNNER_TEMP/doctor.json"
          python - "$project" "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          project, path = sys.argv[1:]
          checks = {c["name"]: c["status"] for c in json.load(open(path, encoding="utf-8"))["checks"]}
          for name in ("база", "миграции", "id базы", "хранилище", f"агент claude-code (проект {project})"):
              assert checks.get(name) == "ok", (name, checks)
          PY

  # образ службы: обе цели Dockerfile, служба из compose отвечает /health и проходит amem doctor
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build --target web -t amem-web:ci .
      - name: amem-web in the web image
        run: |
          docker run --rm amem-web:ci python -c "import amem_web; p = amem_web.static_dir() / 'index.html'; assert p.is_file(), p"
      - run: docker compose build amem
      - name: compose — db and amem, /health, amem doctor
        run: |
          docker compose up -d --wait --wait-timeout 180 amem
          curl -fsS http://127.0.0.1:8767/health
          docker compose exec -T amem amem doctor
      - if: failure()
        run: docker compose logs amem db
      - if: always()
        run: docker compose down -v
