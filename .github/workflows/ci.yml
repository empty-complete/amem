name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # На pull request — только PostgreSQL 18 (вдвое быстрее); обе версии — на push в main.
      AMEMO_TEST_DSNS: ${{ github.event_name == 'pull_request' && 'postgresql://test:test@localhost:5433/test' || 'postgresql://test:test@localhost:5433/test,postgresql://test:test@localhost:5434/test' }}
    defaults:
      run:
        shell: bash          # явный bash — это bash -eo pipefail: упавший pytest | tee валит шаг
    services:
      # тестовые базы, как в docker-compose.yml: 18 на 5433, 16 на 5434
      db-test:
        image: pgvector/pgvector:0.8.1-pg18
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      db-test-pg16:
        image: pgvector/pgvector:0.8.1-pg16
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL client 18 (pg_dump, pg_restore, psql) for backup tests; tesseract language data (rus, eng) for OCR tests
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18 tesseract-ocr tesseract-ocr-rus && break
            echo "apt: попытка $attempt не удалась"; sleep 15
            [ "$attempt" = 3 ] && exit 1
          done
          echo "AMEMO_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - run: ruff check amemo tests tools
      - run: pytest -q -p no:cacheprovider -rA | tee pytest.log
      - name: Restore tests ran once on PostgreSQL 18 and once on 16
        run: |
          for test in test_dump_restores_records_marks_and_search test_snapshot_restore_opens_the_old_file_version test_verify_restores_into_a_temporary_database_and_searches; do
            for db in $(echo "$AMEMO_TEST_DSNS" | tr ',' '\n' | sed -E 's#.*:([0-9]+)/.*#pg\1#'); do
              n=$(grep -c "^PASSED tests/test_backup_restore.py::${test}\[${db}\]" pytest.log || true)
              [ "$n" = 1 ] || { echo "${test}[${db}]: passed $n times"; exit 1; }
            done
          done
      - run: python tools/gen_schema.py --check
      - name: One command — amemo init, amemo install claude-code --project, amemo doctor
        run: |
          PGPASSWORD=test "$AMEMO_PG_BIN/psql" -h localhost -p 5433 -U test -d test -qc "CREATE DATABASE onecmd"
          export HOME="$(mktemp -d)" AMEMO_BACKEND=none
          project="$(mktemp -d)"
          amemo init --dsn postgresql://test:test@localhost:5433/onecmd
          amemo install claude-code --project "$project"
          cd "$project"
          amemo doctor --project "$project"
          amemo doctor --project "$project" --json > "$RUNNER_TEMP/doctor.json"
          python - "$project" "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          project, path = sys.argv[1:]
          checks = {c["name"]: c["status"] for c in json.load(open(path, encoding="utf-8"))["checks"]}
          for name in ("база", "миграции", "id базы", "хранилище", f"агент claude-code (проект {project})"):
              assert checks.get(name) == "ok", (name, checks)
          PY

  # образ службы: обе цели Dockerfile, служба из compose отвечает /health и проходит amemo doctor
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build --target web -t amemo-web:ci .
      - name: amemo-web in the web image
        run: |
          docker run --rm amemo-web:ci python -c "import amemo_web; p = amemo_web.static_dir() / 'index.html'; assert p.is_file(), p"
      - run: docker compose build amemo
      - name: compose — db and amemo, /health, amemo doctor
        run: |
          docker compose up -d --wait --wait-timeout 180 amemo
          curl -fsS http://127.0.0.1:8767/health
          docker compose exec -T amemo amemo doctor
      - if: failure()
        run: docker compose logs amemo db
      - if: always()
        run: docker compose down -v

  # Windows без WSL: PostgreSQL из образа раннера (сборка EDB) и pgvector, собранный из исходников (nmake, MSVC);
  # колесо ветки — через uv tool install, как у пользователя; затем путь docs/install-agent.md (tools/windows_smoke.py)
  windows:
    runs-on: windows-latest
    env:
      PGVECTOR: v0.8.1
      AMEMO_BACKEND: none
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL from the runner image
        run: |
          $root = $env:PGROOT
          if (-not $root -or -not (Test-Path "$root\bin\initdb.exe")) {
            $root = (Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
                     Sort-Object { [int]$_.Name } | Select-Object -Last 1).FullName
          }
          if (-not $root) {
            choco install postgresql17 --no-progress -y --params "/Password:root /NoPath"
            $root = "C:\Program Files\PostgreSQL\17"
          }
          & "$root\bin\postgres.exe" --version
          "PGROOT=$root" >> $env:GITHUB_ENV
          "PGBIN=$root\bin" >> $env:GITHUB_ENV
      - name: pgvector from source (nmake /F Makefile.win)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          git clone --quiet --depth 1 --branch %PGVECTOR% https://github.com/pgvector/pgvector.git "%RUNNER_TEMP%\pgvector" || exit /b 1
          cd /d "%RUNNER_TEMP%\pgvector"
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1
      - name: Database cluster on port 5433
        run: |
          $data = "$env:RUNNER_TEMP\pgdata"
          & "$env:PGBIN\initdb.exe" -D $data -U test --auth=trust -E UTF8 --no-locale
          if ($LASTEXITCODE) { exit 1 }
          & "$env:PGBIN\pg_ctl.exe" -D $data -l "$env:RUNNER_TEMP\postgres.log" -o "-p 5433" -w start
          if ($LASTEXITCODE) { Get-Content "$env:RUNNER_TEMP\postgres.log"; exit 1 }
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -p 5433 -U test onecmd
          if ($LASTEXITCODE) { exit 1 }
      - name: Wheel of this branch, uv tool install
        run: |
          python -m pip install --quiet uv==0.10.4
          uv build --wheel --out-dir dist
          if ($LASTEXITCODE) { exit 1 }
          $wheel = (Get-ChildItem dist\amemo-*.whl).FullName
          uv tool install $wheel
          if ($LASTEXITCODE) { exit 1 }
          $bin = uv tool dir --bin
          $bin >> $env:GITHUB_PATH
      - name: Object store and file lock tests (no database)
        env:
          PYTHONUTF8: "1"         # только pytest: amemo в остальных шагах — без режима UTF-8, как у пользователя
        run: |
          python -m pip install --quiet -e . pytest ocfl-py==2.1.0
          python -m pytest -q -p no:cacheprovider tests/test_portable.py tests/test_ocfl_store.py
          if ($LASTEXITCODE) { exit 1 }
      - name: amemo init, amemo install claude-code, amemo doctor, hooks, tokens, amemo serve /health
        run: |
          $env:HOME = "$env:RUNNER_TEMP\not-the-profile"
          (Get-Command amemo).Source
          python tools/windows_smoke.py "postgresql://test@127.0.0.1:5433/onecmd"
          if ($LASTEXITCODE) { exit 1 }
      - if: failure()
        run: |
          Get-Content "$env:RUNNER_TEMP\postgres.log" -ErrorAction SilentlyContinue
          Get-Content "$env:USERPROFILE\.local\state\amemo\hooks.log" -ErrorAction SilentlyContinue
