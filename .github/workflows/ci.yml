name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # На pull request — только PostgreSQL 18 (вдвое быстрее); обе версии — на push в main.
      AMEMO_TEST_DSNS: ${{ github.event_name == 'pull_request' && 'postgresql://test:test@localhost:5433/test' || 'postgresql://test:test@localhost:5433/test,postgresql://test:test@localhost:5434/test' }}
    defaults:
      run:
        shell: bash          # явный bash — это bash -eo pipefail: упавший pytest | tee валит шаг
    services:
      # тестовые базы, как в docker-compose.yml: 18 на 5433, 16 на 5434
      db-test:
        image: pgvector/pgvector:0.8.1-pg18
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      db-test-pg16:
        image: pgvector/pgvector:0.8.1-pg16
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL 18 with pgvector (client for backup tests, server programs for amemo setup); tesseract language data (rus, eng) for OCR tests
        run: |
          # пакет сервера не создаёт свой кластер main: тестам amemo setup нужны только программы
          sudo install -d /etc/postgresql-common
          echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold postgresql-client-18 postgresql-18 postgresql-18-pgvector tesseract-ocr tesseract-ocr-rus && break
            echo "apt: попытка $attempt не удалась"; sleep 15
            [ "$attempt" = 3 ] && exit 1
          done
          echo "AMEMO_PG_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          echo "AMEMO_TEST_PG_SERVER_BIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
      - run: pip install -e ".[dev]"
      - run: ruff check amemo tests tools
      - run: pytest -q -p no:cacheprovider -rA | tee pytest.log
      - name: Restore tests ran once on PostgreSQL 18 and once on 16
        run: |
          for test in test_dump_restores_records_marks_and_search test_snapshot_restore_opens_the_old_file_version test_verify_restores_into_a_temporary_database_and_searches; do
            for db in $(echo "$AMEMO_TEST_DSNS" | tr ',' '\n' | sed -E 's#.*:([0-9]+)/.*#pg\1#'); do
              n=$(grep -c "^PASSED tests/test_backup_restore.py::${test}\[${db}\]" pytest.log || true)
              [ "$n" = 1 ] || { echo "${test}[${db}]: passed $n times"; exit 1; }
            done
          done
      - run: python tools/gen_schema.py --check
      - name: One command — amemo init, amemo install claude-code --project, amemo doctor
        run: |
          PGPASSWORD=test "$AMEMO_PG_BIN/psql" -h localhost -p 5433 -U test -d test -qc "CREATE DATABASE onecmd"
          export HOME="$(mktemp -d)" AMEMO_BACKEND=none
          project="$(mktemp -d)"
          amemo init --dsn postgresql://test:test@localhost:5433/onecmd
          amemo install claude-code --project "$project"
          cd "$project"
          amemo doctor --project "$project"
          amemo doctor --project "$project" --json > "$RUNNER_TEMP/doctor.json"
          python - "$project" "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, sys
          project, path = sys.argv[1:]
          checks = {c["name"]: c["status"] for c in json.load(open(path, encoding="utf-8"))["checks"]}
          for name in ("база", "миграции", "id базы", "хранилище", f"агент claude-code (проект {project})"):
              assert checks.get(name) == "ok", (name, checks)
          PY

  # образ службы: обе цели Dockerfile, служба из compose отвечает /health и проходит amemo doctor
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build --target web -t amemo-web:ci .
      - name: amemo-web in the web image
        run: |
          docker run --rm amemo-web:ci python -c "import amemo_web; p = amemo_web.static_dir() / 'index.html'; assert p.is_file(), p"
      - run: docker compose build amemo
      - name: compose — db and amemo, /health, amemo doctor
        run: |
          docker compose up -d --wait --wait-timeout 180 amemo
          curl -fsS http://127.0.0.1:8767/health
          docker compose exec -T amemo amemo doctor
      - if: failure()
        run: docker compose logs amemo db
      - if: always()
        run: docker compose down -v

  # Windows без WSL — путь docs/install-agent.md: PostgreSQL 18 из установщика EDB (тот же файл, что ставит
  # winget PostgreSQL.PostgreSQL.18), pgvector из исходников (nmake, MSVC), роль и база amemo — как в «Role and
  # database»; колесо ветки — через uv tool install, как у пользователя; затем tools/windows_smoke.py
  windows:
    runs-on: windows-latest
    env:
      PG_INSTALLER: https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64.exe
      PG_INSTALLER_SHA256: 227E2BC08091B4C2B8338C7D61B11D057F895711480B006F90BFCFCD2410A58A
      PGROOT: C:\Program Files\PostgreSQL\18      # в образе раннера PGROOT указывает на его PostgreSQL 17
      PGVECTOR: v0.8.1
      AMEMO_BACKEND: none
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PostgreSQL 18 — EDB installer, unattended
        run: |
          $installer = "$env:RUNNER_TEMP\postgresql-18.exe"
          Invoke-WebRequest $env:PG_INSTALLER -OutFile $installer -MaximumRetryCount 5 -RetryIntervalSec 10
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($hash -ne $env:PG_INSTALLER_SHA256) { throw "postgresql-18 installer: sha256 $hash" }
          $arguments = "--mode unattended --unattendedmodeui none --superpassword root --serverport 5432 " +
                       "--disable-components stackbuilder,pgAdmin"
          $installed = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
          if ($installed.ExitCode) { throw "postgresql-18 installer: exit code $($installed.ExitCode)" }
          Get-Service postgresql*
          & "$env:PGROOT\bin\psql.exe" --version
      - name: pgvector from source — docs/install-agent.md, step 3C Windows
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd /d %TEMP%
          curl.exe -fsSL --retry 5 -o pgvector.zip https://github.com/pgvector/pgvector/archive/refs/tags/%PGVECTOR%.zip || exit /b 1
          tar -xf pgvector.zip || exit /b 1
          cd pgvector-%PGVECTOR:~1%
          nmake /NOLOGO /F Makefile.win || exit /b 1
          nmake /NOLOGO /F Makefile.win install || exit /b 1
      - name: Role and database amemo — docs/install-agent.md, Role and database (Windows)
        run: |
          $env:PGPASSWORD = "root"
          @'
          CREATE ROLE amemo LOGIN CREATEDB PASSWORD 'amemo-ci';
          CREATE DATABASE amemo OWNER amemo;
          \c amemo
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS btree_gist;
          \c template1
          CREATE EXTENSION IF NOT EXISTS vector;
          '@ | & "$env:PGROOT\bin\psql.exe" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          if ($LASTEXITCODE) { exit 1 }
      - name: Wheel of this branch, uv tool install
        id: wheel
        run: |
          python -m pip install --quiet uv==0.10.4
          uv build --wheel --out-dir dist
          if ($LASTEXITCODE) { exit 1 }
          $wheel = (Get-ChildItem dist\amemo-*.whl).FullName
          uv tool install $wheel
          if ($LASTEXITCODE) { exit 1 }
          $bin = uv tool dir --bin
          $bin >> $env:GITHUB_PATH
      - name: Object store and file lock tests (no database)
        env:
          PYTHONUTF8: "1"         # только pytest: amemo в остальных шагах — без режима UTF-8, как у пользователя
        run: |
          python -m pip install --quiet -e . pytest ocfl-py==2.1.0
          python -m pytest -q -p no:cacheprovider tests/test_portable.py tests/test_ocfl_store.py
          if ($LASTEXITCODE) { exit 1 }
      - name: amemo setup — own PostgreSQL cluster in a data folder, as the desktop installer runs it
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          Remove-Item Env:PGPASSWORD, Env:PGUSER -ErrorAction SilentlyContinue
          $env:AMEMO_CONFIG = "$env:RUNNER_TEMP\setup\amemo.toml"
          $data = "$env:RUNNER_TEMP\setup\amemo-data"
          amemo setup --pg-bin "$env:PGROOT\bin" --data $data --no-auto-update
          if ($LASTEXITCODE) { exit 1 }
          amemo setup --pg-bin "$env:PGROOT\bin" --data $data --json > "$env:RUNNER_TEMP\setup-again.json"
          if ($LASTEXITCODE) { exit 1 }
          amemo doctor --json > "$env:RUNNER_TEMP\setup-doctor.json"
          amemo pg stop
          if ($LASTEXITCODE) { exit 1 }
          amemo pg start
          if ($LASTEXITCODE) { exit 1 }
          amemo pg stop
          if ($LASTEXITCODE) { exit 1 }
          $env:PYTHONUTF8 = "1"          # только проверке: в ней кириллица; amemo выше — без режима UTF-8
          @'
          import json, sys
          again = json.load(open(sys.argv[1], encoding="utf-8"))
          assert again["migrations_applied"] == [] and again["base_id"], again
          checks = {c["name"]: c["status"] for c in json.load(open(sys.argv[2], encoding="utf-8"))["checks"]}
          for name in ("база", "миграции", "id базы", "хранилище"):
              assert checks.get(name) == "ok", (name, checks)
          '@ | python - "$env:RUNNER_TEMP\setup-again.json" "$env:RUNNER_TEMP\setup-doctor.json"
          if ($LASTEXITCODE) { exit 1 }
      - if: failure()
        run: Get-Content "$env:RUNNER_TEMP\setup\amemo-data\pg\log\postgresql.log" -Tail 50 -ErrorAction SilentlyContinue
      - name: amemo init, install claude-code, doctor, hooks, tokens, serve /health, backup create and verify
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}     # и после упавших тестов хранилища
        run: |
          Remove-Item Env:PGPASSWORD, Env:PGUSER -ErrorAction SilentlyContinue      # из образа раннера
          $env:HOME = "$env:RUNNER_TEMP\not-the-profile"
          $env:AMEMO_PG_BIN = "$env:PGROOT\bin"
          (Get-Command amemo).Source
          python tools/windows_smoke.py "postgresql://amemo:amemo-ci@127.0.0.1:5432/amemo"
          if ($LASTEXITCODE) { exit 1 }
      - if: failure()
        run: |
          Get-ChildItem "$env:PGROOT\data\log" -ErrorAction SilentlyContinue | Get-Content -Tail 50
          Get-Content "$env:USERPROFILE\.local\state\amemo\hooks.log" -ErrorAction SilentlyContinue
