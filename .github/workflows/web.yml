name: web
on:
  push:
    branches: [main]
    paths: ["web/**", "docs/api/**", "amemo/**", "pyproject.toml", "tools/seed_sample.py", "tools/check_ui_wheel.py", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "docs/api/**", "amemo/**", "pyproject.toml", "tools/seed_sample.py", "tools/check_ui_wheel.py", ".github/workflows/web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Контракт (redocly lint)
        run: npx --yes @redocly/cli@2 lint ../docs/api/http-v1.openapi.yaml --config ../docs/api/redocly.yaml
      - run: npm run lint
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run chunks
      - run: npm run size
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пакет amemo-web
        working-directory: web/python
        run: pip install -q -e ".[dev]" && pytest -q tests
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # веб на настоящей службе (часть H): колёса amemo и amemo-web в чистом окружении, /ui по правилам службы,
  # e2e на образце «метеостанция» (tools/seed_sample.py)
  web-service:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:0.8.1-pg18
        env: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      AMEMO_DSN: postgresql://test:test@127.0.0.1:5432/test
      AMEMO_PACKS: ${{ github.workspace }}/tools/sample-pack/meteo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Колёса amemo и amemo-web в чистом окружении
        run: |
          pip install -q build
          python -m build -q --wheel -o wheels .
          python -m build -q --wheel -o wheels web/python
          python -m venv /tmp/amemo
          /tmp/amemo/bin/pip install -q wheels/amemo-*.whl wheels/amemo_web-*.whl
      - name: /ui из колёс — CSP, кэш, маршруты
        run: /tmp/amemo/bin/python tools/check_ui_wheel.py
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: e2e против службы
        working-directory: web
        env:
          AMEMO_PYTHON: /tmp/amemo/bin/python
        run: npx playwright test -c playwright.service.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-service
          path: web/playwright-report-service
          retention-days: 7

