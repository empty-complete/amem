name: web
on:
  push:
    branches: [main]
    paths: ["web/**", "docs/api/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "docs/api/**", ".github/workflows/web.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Контракт (redocly lint)
        run: npx --yes @redocly/cli@2 lint ../docs/api/http-v1.openapi.yaml --config ../docs/api/redocly.yaml
      - run: npm run lint
      - run: npm run api:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run chunks
      - run: npm run size
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пакет amem-web
        working-directory: web/python
        run: pip install -q -e ".[dev]" && pytest -q tests
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
