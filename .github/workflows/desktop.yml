name: desktop
# Приложение amemo для Windows (desktop/, Tauri 2; спецификация приложения для Windows, D3, D5–D7).
# - build: страницы мастера (web, setup.html), запускатель bin\amemo.exe (desktop/launcher), tauri build → установщик
#   NSIS для текущего пользователя и подпись обновления.
# - check: как у человека, без прав администратора — тихая установка; установка мастером без окна
#   (--setup-unattended) из комплекта и модели этой ветки (runtime.yml), которые отдаёт свой сервер вместо страницы
#   релиза, в папку данных с кириллицей, с Claude: плагин и Claude Code получают путь запускателя; запуск в фоне —
#   /health службы, смысловой поиск, хук через запускатель; второй запуск не создаёт второй процесс; --quit
#   останавливает службу и PostgreSQL; обновление N → N+1 (вторая сборка с версией N+1, latest.json со своего
#   сервера): приложение, затем комплект с бэкапом, база та же; удаление убирает всё, кроме папки данных.
# release.yml подключит его как workflow_call (D8).
#
# Подпись обновлений: секрет TAURI_SIGNING_PRIVATE_KEY (и TAURI_SIGNING_PRIVATE_KEY_PASSWORD) — ключ владельца,
# открытый ключ — plugins.updater.pubkey в desktop/src-tauri/tauri.conf.json. Пока секрета нет, сборка подписывает
# одноразовым ключом этого запуска: проверяется сама подпись, но такие файлы не годятся для выпуска.
on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml", "web/public/favicon.svg", "web/src/setup/**",
            "web/setup.html", "web/vite.setup.config.ts", "amemo/__init__.py", "amemo/cli/commands/local.py",
            "amemo/localpg.py", "amemo/agents/**", "tools/release.py", "tools/runtime.py",
            ".github/workflows/runtime.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml", "web/src/setup/**"]
  workflow_dispatch:
  workflow_call:
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/launcher -> target
      - run: npm ci
      - name: npm ci (web — pages of the wizard)
        working-directory: web
        run: npm ci
      - name: Icons from web/public/favicon.svg
        run: |
          npx tauri icon ../web/public/favicon.svg -o src-tauri/icons
          if ($LASTEXITCODE) { exit 1 }
      - name: tauri build (wizard pages, launcher, NSIS for the current user), version from amemo/__init__.py
        env:
          OWNER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          OWNER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python -m pip install --quiet packaging
          $version = python ../tools/release.py semver
          if ($LASTEXITCODE) { exit 1 }
          # версия PEP 440 — в имена файлов релиза (комплект, модель), которые качает мастер
          $env:AMEMO_VERSION = (Select-String -Path ../amemo/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $config = @{ version = $version }
          $insecure = $false
          if ($env:OWNER_KEY) {
            $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
            if (-not $pubkey) { throw "секрет TAURI_SIGNING_PRIVATE_KEY есть, а plugins.updater.pubkey пуст" }
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:OWNER_KEY
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:OWNER_KEY_PASSWORD
          } else {
            Write-Output "ключа владельца нет: подпись одноразовым ключом этого запуска"
            npx tauri signer generate --ci -w "$env:RUNNER_TEMP\updater.key"       # --ci: без пароля и вопросов
            if ($LASTEXITCODE) { exit 1 }
            # проверка обновления N → N+1 (job check) идёт со своего сервера http://127.0.0.1 — только в сборках CI
            $config.plugins = @{ updater = @{ pubkey = (Get-Content "$env:RUNNER_TEMP\updater.key.pub" -Raw).Trim();
                                              dangerousInsecureTransportProtocol = $true } }
            $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content "$env:RUNNER_TEMP\updater.key" -Raw).Trim()
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
            $insecure = $true
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\tauri.ci.json"
          Get-Content "$env:RUNNER_TEMP\tauri.ci.json"
          Write-Output "amemo $env:AMEMO_VERSION, приложение $version"
          npx tauri build --ci --config "$env:RUNNER_TEMP\tauri.ci.json"
          if ($LASTEXITCODE) { exit 1 }
          $bundle = "src-tauri/target/release/bundle/nsis"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-Item "$bundle/amemo_${version}_x64-setup.exe"
          if (-not (Test-Path "$($setup.FullName).sig")) { throw "нет подписи обновления $($setup.Name).sig" }
          Copy-Item "$($setup.FullName)*" out/
          $lines = @("APP_VERSION=$version", "AMEMO_VERSION=$env:AMEMO_VERSION")
          if ($insecure) {
            # N+1 — та же сборка со следующей версией: на ней job check проверяет обновление и переход на комплект
            $next = python -c "import sys; from packaging.version import Version; v = Version(sys.argv[1]); r = (list(v.release) + [0, 0])[:3]; print(f'{r[0]}.{r[1]}.{r[2]}{v.pre[0]}{v.pre[1] + 1}' if v.pre else f'{r[0]}.{r[1]}.{r[2] + 1}')" $env:AMEMO_VERSION
            $nextApp = python ../tools/release.py semver $next
            if ($LASTEXITCODE) { exit 1 }
            $config.version = $nextApp
            $config | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\tauri.next.json"
            $env:AMEMO_VERSION = $next
            Write-Output "N+1: amemo $next, приложение $nextApp"
            npx tauri build --ci --config "$env:RUNNER_TEMP\tauri.next.json"
            if ($LASTEXITCODE) { exit 1 }
            Copy-Item "$bundle/amemo_${nextApp}_x64-setup.exe*" out/
            $lines += @("NEXT_APP_VERSION=$nextApp", "NEXT_AMEMO_VERSION=$next")
          }
          $lines | Set-Content -Encoding utf8NoBOM out/version.txt
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: desktop/out/
          retention-days: 14

  runtime:
    uses: ./.github/workflows/runtime.yml

  check:
    needs: [build, runtime]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      SETUP: ${{ github.workspace }}\setup
      RELEASE: ${{ github.workspace }}\release
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: setup
      - uses: actions/download-artifact@v4
        with:
          name: runtime-windows-x64
          path: release
      - name: Silent install for the current user
        run: |
          $v = ConvertFrom-StringData (Get-Content "$env:SETUP\version.txt" -Raw)
          $version = $v.APP_VERSION
          $setup = Get-Item "$env:SETUP\amemo_${version}_x64-setup.exe"
          $installer = Start-Process $setup.FullName -ArgumentList "/S" -PassThru
          $installer.WaitForExit()
          if ($installer.ExitCode) { throw "установщик: код $($installer.ExitCode)" }
          $key = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -eq "amemo" } | Select-Object -First 1
          if (-not $key) { throw "нет записи amemo в HKCU ...\Uninstall: установка не для текущего пользователя" }
          $entry = Get-ItemProperty $key.PSPath
          Write-Output "установлено: $($entry.DisplayName) $($entry.DisplayVersion) в $($entry.InstallLocation)"
          if ($entry.DisplayVersion -ne $version) { throw "версия $($entry.DisplayVersion), ожидалась $version" }
          $dir = $entry.InstallLocation.Trim('"')
          if (-not $dir.StartsWith($env:LOCALAPPDATA)) { throw "установлено не в %LOCALAPPDATA%: $dir" }
          Get-ChildItem $dir -Recurse -Depth 1 | Format-Table FullName, Length
          if (-not (Test-Path "$dir\bin\amemo.exe")) { throw "нет запускателя $dir\bin\amemo.exe" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object Name -notlike "uninstall*" | Select-Object -First 1
          Get-Process -Name $exe.BaseName -ErrorAction SilentlyContinue | Stop-Process -Force   # если установщик запустил
          "APP_DIR=$dir" >> $env:GITHUB_ENV
          "APP_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "UNINSTALL_KEY=$($key.PSPath)" >> $env:GITHUB_ENV
      - name: Wizard install without a window — runtime and model of this branch from a local server
        run: |
          Get-ChildItem $env:RELEASE | Format-Table Name, Length
          $server = Start-Process python -ArgumentList "-m", "http.server", "8790", "--bind", "127.0.0.1", "--directory", $env:RELEASE -PassThru -WindowStyle Hidden
          "SERVER_PID=$($server.Id)" >> $env:GITHUB_ENV
          Start-Sleep 2
          # кириллица вне кодовой страницы ANSI раннера (1252): мастер проверяет путь, amemo setup даёт PostgreSQL
          # короткие имена 8.3
          $data = "$env:USERPROFILE\Проверка приложения\amemo-data"
          # Claude: Claude Code — прямо (команды claude на раннере нет — установщик правит файлы), приложение Claude —
          # zip плагина в «Загрузках»
          @{ lang = "ru"; dataDir = $data; docsDir = $null; ocr = @(); agents = @("claude") } | ConvertTo-Json |
            Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP\choices.json"
          Remove-Item Env:PGPASSWORD, Env:PGUSER, Env:PGROOT, Env:PGBIN, Env:PGDATA -ErrorAction SilentlyContinue
          $env:AMEMO_RELEASE_BASE = "http://127.0.0.1:8790/"
          $run = Start-Process $env:APP_EXE -ArgumentList "--setup-unattended", "`"$env:RUNNER_TEMP\choices.json`"" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\unattended.out" -RedirectStandardError "$env:RUNNER_TEMP\unattended.err" -PassThru
          if (-not $run.WaitForExit(1200000)) { throw "установка не закончилась за 20 минут" }   # не -Wait: PostgreSQL остаётся
          Get-Content "$env:RUNNER_TEMP\unattended.out" | Where-Object { $_ -notmatch '"stage":"download","state":"running","received"' }
          if ($run.ExitCode) { Get-Content "$env:RUNNER_TEMP\unattended.err" -Tail 40; throw "установка: код $($run.ExitCode)" }
          $lines = Get-Content "$env:RUNNER_TEMP\unattended.out" | ForEach-Object { $_ | ConvertFrom-Json }
          $check = ($lines | Where-Object { $_.check }).check
          if (-not $check.ansiSafe) { throw "мастер счёл папку $data недоступной PostgreSQL: $($check | ConvertTo-Json)" }
          if ($check.free -le 0) { throw "мастер не узнал свободное место: $($check | ConvertTo-Json)" }
          $done = @{}
          $lines | Where-Object { $_.stage } | ForEach-Object { $done[$_.stage] = $_.state }
          $expected = @{ download = "done"; database = "done"; store = "done"; search = "done"; ocr = "skipped"; agents = "done" }
          foreach ($stage in $expected.Keys) {
            if ($done[$stage] -ne $expected[$stage]) { throw "шаг ${stage}: $($done[$stage]), ожидалось $($expected[$stage])" }
          }
          if (Test-Path "$env:APP_DIR\downloads") { throw "загрузки не убраны после установки" }
          # агентам — постоянный путь запускателя, а не python этой версии комплекта: в плагине и в Claude Code
          $launcher = "$env:APP_DIR\bin\amemo.exe"
          $zip = "$env:USERPROFILE\Downloads\amemo-plugin.zip"
          if (-not (Test-Path $zip)) { throw "нет плагина $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          $names = $archive.Entries.FullName
          $read = { param($name) $r = [IO.StreamReader]::new($archive.GetEntry($name).Open()); $t = $r.ReadToEnd(); $r.Close(); $t | ConvertFrom-Json }
          $server = (& $read ".mcp.json").mcpServers.amemo
          $hooks = (& $read "hooks/hooks.json").hooks
          $archive.Dispose()
          Write-Output "плагин: $($names -join ', ')"
          if ($server.command -ne $launcher) { throw "сервер MCP плагина: $($server.command), ожидался $launcher" }
          foreach ($event in "SessionStart", "UserPromptSubmit", "PreCompact") {
            $hook = $hooks.$event[0].hooks[0]
            if ($hook.command -ne $launcher -or ($hook.args -join " ") -ne "hook $event") { throw "хук ${event} плагина: $($hook | ConvertTo-Json)" }
          }
          $settings = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw | ConvertFrom-Json
          if ($settings.hooks.SessionStart[0].hooks[0].command -ne $launcher) { throw "хук Claude Code: $($settings.hooks.SessionStart | ConvertTo-Json -Depth 6)" }
          $mcp = (Get-Content "$env:USERPROFILE\.claude.json" -Raw | ConvertFrom-Json).mcpServers.amemo
          if ($mcp.command -ne $launcher) { throw "сервер MCP Claude Code: $($mcp.command), ожидался $launcher" }
          Write-Output "комплект: $(Get-Content "$env:APP_DIR\runtime\current")"
          # повторная установка («Повторить» в мастере) — с места: ничего не качается заново, setup переиспользует базу
          $again = Start-Process $env:APP_EXE -ArgumentList "--setup-unattended", "`"$env:RUNNER_TEMP\choices.json`"" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\again.out" -PassThru
          if (-not $again.WaitForExit(600000) -or $again.ExitCode) { Get-Content "$env:RUNNER_TEMP\again.out"; throw "повторная установка не прошла" }
          & "$env:APP_DIR\bin\amemo.exe" pg stop          # фон приложение поднимет само
          if ($LASTEXITCODE) { exit 1 }
      - name: Background start — PostgreSQL, service /health, launcher, single instance, --quit
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8          # вывод amemo — UTF-8 (имена проверок doctor)
          $app = Start-Process $env:APP_EXE -ArgumentList "--background" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 2
            if ($app.HasExited) { throw "приложение завершилось с кодом $($app.ExitCode)" }
            try { $ok = (Invoke-WebRequest http://127.0.0.1:8767/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch {}
          }
          if (-not $ok) { throw "служба не ответила на /health за 3 минуты" }
          Write-Output "фон: /health — 200"
          $amemo = "$env:APP_DIR\bin\amemo.exe"
          & $amemo --version
          if ($LASTEXITCODE) { exit 1 }
          $status = & $amemo pg status --json | ConvertFrom-Json
          if (-not $status.running) { throw "PostgreSQL не запущен: $($status | ConvertTo-Json)" }
          $doctor = & $amemo doctor --json | ConvertFrom-Json
          $bad = $doctor.checks | Where-Object { $_.name -in "база", "миграции", "id базы", "хранилище" -and $_.status -ne "ok" }
          if ($bad) { throw "amemo doctor: $($bad | ConvertTo-Json)" }
          $search = & $amemo search "проверка комплекта" --json | ConvertFrom-Json
          if ($search.semantic -eq "unavailable") { throw "смысловой поиск выключен: $($search.channels | ConvertTo-Json)" }
          # хук через запускатель — как его зовут Claude Code и плагин: ответ протокола хуков, код 0
          $reply = '{"hook_event_name": "SessionStart", "source": "startup"}' | & $amemo hook SessionStart
          if ($LASTEXITCODE) { throw "amemo hook SessionStart: код $LASTEXITCODE" }
          Write-Output "хук SessionStart: $(($reply | Out-String).Length) символов ответа; поиск: $($search.semantic)"
          $second = Start-Process $env:APP_EXE -PassThru
          if (-not $second.WaitForExit(15000)) { throw "второй запуск не завершился: два экземпляра" }
          $name = [IO.Path]::GetFileNameWithoutExtension($env:APP_EXE)
          $running = @(Get-Process -Name $name -ErrorAction SilentlyContinue | Where-Object Path -eq $env:APP_EXE)
          if ($running.Count -ne 1) { throw "процессов ${name}: $($running.Count), нужен один" }
          $quit = Start-Process $env:APP_EXE -ArgumentList "--quit" -PassThru
          if (-not $quit.WaitForExit(60000)) { throw "--quit не завершился за минуту" }
          if (-not $app.WaitForExit(30000)) { throw "приложение не завершилось по --quit" }
          try { Invoke-WebRequest http://127.0.0.1:8767/health -UseBasicParsing -TimeoutSec 3 | Out-Null; throw "служба отвечает после --quit" } catch [System.Net.Http.HttpRequestException] {}
          $left = @(Get-Process python -ErrorAction SilentlyContinue | Where-Object Path -like "$env:APP_DIR\runtime\*")
          if ($left) { throw "после --quit остались процессы Python комплекта: $($left.Id)" }
          $status = & $amemo pg status --json | ConvertFrom-Json
          if ($status.running) { throw "PostgreSQL работает после --quit" }
          Write-Output "фон: запуск, запускатель, один экземпляр, остановка — ок"
      - name: Update N → N+1 — app by the updater, then its runtime with a backup; the base is kept
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $v = ConvertFrom-StringData (Get-Content "$env:SETUP\version.txt" -Raw)
          $next = $v.NEXT_AMEMO_VERSION
          $nextApp = $v.NEXT_APP_VERSION
          $amemo = "$env:APP_DIR\bin\amemo.exe"
          # «релиз» N+1 на своём сервере: установщик с подписью, latest.json, комплект под новым именем
          $setup = Get-Item "$env:SETUP\amemo_${nextApp}_x64-setup.exe"
          Copy-Item "$($setup.FullName)*" $env:RELEASE
          $runtime = Get-Item "$env:RELEASE\amemo-runtime-$($v.AMEMO_VERSION)-windows-x64.zip"
          $name = "amemo-runtime-$next-windows-x64.zip"
          Copy-Item $runtime.FullName "$env:RELEASE\$name"
          "$((Get-FileHash "$env:RELEASE\$name" -Algorithm SHA256).Hash.ToLower())  $name" |
            Set-Content -Encoding ascii "$env:RELEASE\$name.sha256"
          python -m pip install --quiet packaging
          python src/tools/release.py latest --setup "$env:RELEASE\$($setup.Name)" --version $next `
            --url "http://127.0.0.1:8790/$($setup.Name)" --notes "CI" --out "$env:RELEASE\latest.json"
          if ($LASTEXITCODE) { exit 1 }
          Get-Content "$env:RELEASE\latest.json"
          & $amemo pg start
          $before = & $amemo base --json | ConvertFrom-Json
          & $amemo pg stop
          $backups = @(Get-ChildItem "$env:USERPROFILE\Проверка приложения\amemo-data\backups" -Recurse -Filter *.json -ErrorAction SilentlyContinue).Count
          $env:AMEMO_UPDATE_URL = "http://127.0.0.1:8790/latest.json"
          $env:AMEMO_RELEASE_BASE = "http://127.0.0.1:8790/"
          Start-Process $env:APP_EXE -ArgumentList "--background" | Out-Null
          $done = $false
          for ($i = 0; $i -lt 120 -and -not $done; $i++) {
            Start-Sleep 5
            $installed = (Get-ItemProperty $env:UNINSTALL_KEY -ErrorAction SilentlyContinue).DisplayVersion
            $current = Get-Content "$env:APP_DIR\runtime\current" -ErrorAction SilentlyContinue
            $state = Get-Content "$env:APP_DIR\state.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
            $healthy = $false
            try { $healthy = (Invoke-WebRequest http://127.0.0.1:8767/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200 } catch {}
            if ($i % 6 -eq 0) { Write-Output "через $($i * 5) с: приложение $installed, комплект $current, state.runtime $($state.runtime), /health $healthy" }
            $done = $installed -eq $nextApp -and $current -eq $next -and $state.runtime -eq $next -and $healthy
          }
          if (-not $done) { throw "обновление до $nextApp не завершилось за 10 минут" }
          $after = & $amemo base --json | ConvertFrom-Json
          if ($after.base_id -ne $before.base_id) { throw "после обновления другая база: $($after.base_id), была $($before.base_id)" }
          if (($after.counts | ConvertTo-Json) -ne ($before.counts | ConvertTo-Json)) { throw "после обновления изменились записи: $($after.counts | ConvertTo-Json)" }
          $now = @(Get-ChildItem "$env:USERPROFILE\Проверка приложения\amemo-data\backups" -Recurse -Filter *.json).Count
          if ($now -le $backups) { throw "перед обновлением не сделан бэкап базы ($backups → $now)" }
          $config = Get-Content "$env:USERPROFILE\.config\amemo\amemo.toml" -Raw
          if ($config -notmatch [regex]::Escape("runtime\$next")) { throw "pg_bin в amemo.toml — не из нового комплекта" }
          if (Test-Path "$env:USERPROFILE\Проверка приложения\amemo-data\pg.before-update") { throw "снимок кластера не убран" }
          if (Test-Path "$env:APP_DIR\runtime\$($v.AMEMO_VERSION)") { Write-Output "прежний комплект пока не удалён (занят?)" }
          & $amemo --version
          Write-Output "обновление $($v.APP_VERSION) → ${nextApp}: база $($after.base_id) сохранена, бэкап есть"
          $quit = Start-Process $env:APP_EXE -ArgumentList "--quit" -PassThru
          if (-not $quit.WaitForExit(60000)) { throw "--quit не завершился за минуту" }
          for ($i = 0; $i -lt 30 -and (Get-Process -Name ([IO.Path]::GetFileNameWithoutExtension($env:APP_EXE)) -ErrorAction SilentlyContinue | Where-Object Path -eq $env:APP_EXE); $i++) { Start-Sleep 1 }
      - name: Uninstall
        run: |
          $uninstaller = Start-Process "$env:APP_DIR\uninstall.exe" -ArgumentList "/S" -PassThru
          $uninstaller.WaitForExit()
          if ($uninstaller.ExitCode) { throw "удаление: код $($uninstaller.ExitCode)" }
          # удалитель работает из своей копии: exe и запись в реестре пропадают не сразу
          for ($i = 0; $i -lt 30 -and ((Test-Path $env:APP_EXE) -or (Test-Path $env:UNINSTALL_KEY)); $i++) { Start-Sleep 2 }
          if (Test-Path $env:APP_EXE) { throw "после удаления остался $env:APP_EXE" }
          if (Test-Path $env:UNINSTALL_KEY) { throw "после удаления осталась запись в Uninstall" }
          if (Test-Path $env:APP_DIR) { Get-ChildItem $env:APP_DIR -Recurse -Depth 1 | Format-Table FullName; throw "после удаления осталась $env:APP_DIR" }
          $run = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue
          if ($run.amemo) { throw "после удаления остался автозапуск: $($run.amemo)" }
          $claude = Get-Content "$env:USERPROFILE\.claude.json" -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json
          if ($claude.mcpServers.amemo) { throw "после удаления в Claude Code остался сервер amemo" }
          if (-not (Test-Path "$env:USERPROFILE\Проверка приложения\amemo-data\pg\PG_VERSION")) { throw "удаление тронуло папку данных" }
          Write-Output "установка и удаление без прав администратора: ок; папка данных цела"
      - if: always()
        run: |
          if ($env:SERVER_PID) { Stop-Process -Id $env:SERVER_PID -ErrorAction SilentlyContinue }
          foreach ($log in "app.log", "setup.log", "serve.log") {
            Write-Output "=== $log"
            Get-Content "$env:APP_DIR\logs\$log" -Tail 80 -ErrorAction SilentlyContinue
          }
          Write-Output "=== postgresql.log"
          Get-Content "$env:USERPROFILE\Проверка приложения\amemo-data\pg\log\postgresql.log" -Tail 40 -ErrorAction SilentlyContinue
