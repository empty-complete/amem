# Служба amemo и её база. Настройки — в .env (образец .env.example); секретов в этом файле нет.
#   docker compose up -d --wait amemo                    — база и служба на http://127.0.0.1:8767
#   docker compose --profile web up -d --wait amemo-web  — то же с веб-интерфейсом (/ui); вместо amemo, не вместе:
#                                                        порт и тома у них общие
# Тестовые базы — профиль test (ниже).

x-amemo: &amemo
  build: {context: ., target: service, args: {OCR_LANGS: "${AMEMO_OCR_LANGS:-}"}}
  image: amemo:local
  restart: unless-stopped
  depends_on:
    db: {condition: service_healthy}
  environment: &amemo-env
    AMEMO_DSN: postgresql://amemo:${AMEMO_PG_PASSWORD:-amemo}@db:5432/amemo
    AMEMO_AGENT: ${AMEMO_AGENT:-}                # человек службы (person:…); пусто — person: + имя пользователя ОС
    AMEMO_TOKENS: ${AMEMO_TOKENS:-}              # пусто — без входа (--no-auth): порт наружу только 127.0.0.1
    AMEMO_ALLOWED_HOSTS: amemo                   # Host: amemo:8767 из сети compose; localhost и 127.0.0.1 — всегда
    AMEMO_DOCS: /var/lib/amemo/docs
    # служба слушает 0.0.0.0:8767 внутри сети (AMEMO_HOST и AMEMO_PORT заданы в образе)
  volumes:
    - amemo-objects:/var/lib/amemo/objects       # хранилище копий (OCFL)
    - amemo-state:/var/lib/amemo/state           # загрузки, подборки, журнал запросов, файл токенов
    - amemo-backups:/var/lib/amemo/backups       # amemo backup create
    - ${AMEMO_DOCS_DIR:-amemo-docs}:/var/lib/amemo/docs:ro
  ports:
    - "127.0.0.1:${AMEMO_PUBLISH_PORT:-8767}:8767"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8767/health', timeout=4).read() == b'ok' else 1)"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 5

services:
  amemo:
    <<: *amemo

  # Служба с веб-интерфейсом: образ с amemo[web] (пакет amemo-web, статика /ui)
  amemo-web:
    <<: *amemo
    profiles: ["web"]
    build: {context: ., target: web, args: {OCR_LANGS: "${AMEMO_OCR_LANGS:-}"}}
    image: amemo-web:local
    environment:
      <<: *amemo-env
      AMEMO_ALLOWED_HOSTS: amemo,amemo-web

  # База схемы v1: PostgreSQL 18 + pgvector. Запуск: docker compose up -d --wait db
  db:
    image: pgvector/pgvector:0.8.1-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: amemo
      POSTGRES_USER: amemo
      POSTGRES_PASSWORD: ${AMEMO_PG_PASSWORD:-amemo}
      # пароль задаётся только при первом создании базы; потом его меняют в самой базе (ALTER ROLE)
    volumes:
      - amemo-pg:/var/lib/postgresql    # у образа PostgreSQL 18 данные — в /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:5435:5432"            # 5432 на этой машине уже занят другим Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U amemo -d amemo"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Тестовые базы: данные в памяти, без fsync. PostgreSQL 18 — основная, 16 — проверка совместимости.
  # Перед тестами: docker compose --profile test up -d --wait db-test db-test-pg16 — только по именам,
  # без имён поднялась бы и рабочая база.
  db-test:
    image: pgvector/pgvector:0.8.1-pg18
    profiles: ["test"]
    environment: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs: ["/var/lib/postgresql"]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-test-pg16:
    image: pgvector/pgvector:0.8.1-pg16
    profiles: ["test"]
    environment: {POSTGRES_DB: test, POSTGRES_USER: test, POSTGRES_PASSWORD: test}
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    tmpfs: ["/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  amemo-pg:
    name: amemo-pg      # имя не зависит от папки проекта: из рабочего дерева и из основной папки — один том
  amemo-objects:
    name: amemo-objects
  amemo-state:
    name: amemo-state
  amemo-backups:
    name: amemo-backups
  amemo-docs:
    name: amemo-docs
