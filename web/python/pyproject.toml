[project]
name = "amem-web"
dynamic = ["version"]                # amem_web.__version__ — та же, что у amem (tools/release.py)
description = "Web UI of amem as static files; the amem service serves them at /ui"
readme = "README.md"
license = "MIT"                      # текст лицензии — в LICENSE.txt репозитория amem
authors = [{name = "empty-complete"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/empty-complete/amem"
Source = "https://github.com/empty-complete/amem/tree/main/web"
Issues = "https://github.com/empty-complete/amem/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "amem_web/__init__.py"

# сборка веба (npm run build) — в .gitignore, но входит и в sdist, и в колесо: колесо из sdist тоже со статикой
[tool.hatch.build]
artifacts = ["amem_web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["amem_web"]
