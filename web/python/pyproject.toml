[project]
name = "amemo-web"
dynamic = ["version"]                # amemo_web.__version__ — та же, что у amemo (tools/release.py)
description = "Web UI of amemo as static files; the amemo service serves them at /ui"
readme = "README.md"
license = "MIT"                      # текст лицензии — в LICENSE.txt репозитория amemo
authors = [{name = "empty-complete"}]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database :: Front-Ends",
]

[project.urls]
Homepage = "https://github.com/empty-complete/amemo"
Source = "https://github.com/empty-complete/amemo/tree/main/web"
Issues = "https://github.com/empty-complete/amemo/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "amemo_web/__init__.py"

# сборка веба (npm run build) — в .gitignore, но входит и в sdist, и в колесо: колесо из sdist тоже со статикой
[tool.hatch.build]
artifacts = ["amemo_web/dist/**"]

[tool.hatch.build.targets.wheel]
packages = ["amemo_web"]
